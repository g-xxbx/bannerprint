version: 1

# MySQL：二进制握手包。字节布局：
#   [0:3] payload length (LE) | [3] sequence id | [4] protocol version (0x0A) | version string
# 规则直接在原始字节上匹配，因此无需协议专属代码。
rules:
  - id: mysql.handshake
    protocol: MySQL
    product: MySQL
    priority: 400
    kind: binary
    match: '(?s)^[\x00-\xff]{4}\x0a[0-9]+\.[0-9]+\.[0-9]+'
    version: '(?s)^[\x00-\xff]{4}\x0a([0-9]+\.[0-9]+\.[0-9]+)'
