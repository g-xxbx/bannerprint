version: 1

# HTTP：按 Server 头识别产品。443/8443 同样输出 HTTP（端口不作为判定依据）。
rules:
  - id: http.nginx
    protocol: HTTP
    product: nginx
    priority: 300
    kind: text
    match: '(?i)(?m)^server:[ \t]*nginx(?:/|[\s;]|$)'
    version: '(?i)nginx/([0-9][0-9.]*)'
    os_hint:
      - match: '(?i)\(ubuntu\)|\bubuntu\b'
        value: Ubuntu
      - match: '(?i)\(debian\)|\bdebian\b'
        value: Debian

  - id: http.apache
    protocol: HTTP
    product: Apache
    priority: 300
    kind: text
    match: '(?i)(?m)^server:[ \t]*apache(?:/|[\s;]|$)'
    version: '(?i)Apache/([0-9][0-9.]*)'
    os_hint:
      - match: '(?i)\(ubuntu\)|\bubuntu\b'
        value: Ubuntu
      - match: '(?i)\(debian\)|\bdebian\b'
        value: Debian
      - match: '(?i)\(centos\)|\bcentos\b'
        value: CentOS

  # Jetty 的 Server 头可被轻易覆盖，置信度低于 nginx/Apache。
  - id: http.jetty
    protocol: HTTP
    product: Jetty
    priority: 300
    kind: text
    match: '(?i)(?m)^server:[ \t]*jetty(?:/|[\s;]|$)'
    version: '(?i)Jetty/([0-9][0-9.]*)'
    confidence: 0.85

  - id: http.iis
    protocol: HTTP
    product: Microsoft-IIS
    priority: 300
    kind: text
    match: '(?i)(?m)^server:[ \t]*microsoft-iis(?:/|[\s;]|$)'
    version: '(?i)Microsoft-IIS/([0-9][0-9.]*)'

  - id: http.caddy
    protocol: HTTP
    product: Caddy
    priority: 300
    kind: text
    match: '(?i)(?m)^server:[ \t]*caddy(?:/|[\s;]|$)'
    version: '(?i)Caddy/([0-9][0-9.]*)'

  - id: http.openresty
    protocol: HTTP
    product: openresty
    priority: 300
    kind: text
    match: '(?i)(?m)^server:[ \t]*openresty(?:/|[\s;]|$)'
    version: '(?i)openresty/([0-9][0-9.]*)'

  - id: http.lighttpd
    protocol: HTTP
    product: lighttpd
    priority: 300
    kind: text
    match: '(?i)(?m)^server:[ \t]*lighttpd(?:/|[\s;]|$)'
    version: '(?i)lighttpd/([0-9][0-9.]*)'

  - id: http.tomcat
    protocol: HTTP
    product: Tomcat
    priority: 300
    kind: text
    match: '(?i)(?m)^server:[ \t]*(apache-coyote|apache tomcat)(?:/|[\s;]|$)'
    version: '(?i)(?:Apache-Coyote|Apache Tomcat)/([0-9][0-9.]*)'

  # Elasticsearch 通过 HTTP JSON 暴露版本，无 Server 头。
  - id: http.elasticsearch
    protocol: HTTP
    product: Elasticsearch
    priority: 310
    kind: text
    match: '(?i)"tagline"\s*:\s*"You Know, for Search"'
    version: '(?i)"number"\s*:\s*"([0-9]+\.[0-9]+\.[0-9]+)"'

  # Docker Engine API：任何响应都带 Api-Version 头。
  - id: http.docker
    protocol: HTTP
    product: Docker
    priority: 310
    kind: text
    match: '(?im)^api-version:\s*[0-9]'
    version: '(?im)^api-version:\s*([0-9]+\.[0-9]+)'

  # HTTP/2 连接前言（明文 h2c）。
  - id: http.h2-preface
    protocol: HTTP
    priority: 300
    kind: binary
    match: '(?s)^PRI \* HTTP/2\.0'
    confidence: 0.7

  # 只认出协议。
  - id: http.generic
    protocol: HTTP
    priority: 120
    kind: text
    match: '(?i)^[ \t]*HTTP/[0-9]\.[0-9]'
